# Builds the English-enabled images for the Sales CRM server (amd64 only, the server is a t3a).
# Runs on every push to a sales-crm-en-* branch (workflow_dispatch only lists workflows on the
# default branch). Upstream's workflows were removed from this branch so pushes here don't
# start their CI, e2e and release jobs.
name: Sales CRM images

on:
  push:
    branches: ["sales-crm-en-*"]
  workflow_dispatch:
    inputs:
      version:
        description: Upstream release this branch is based on, without the v
        default: "1.113.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: deskcommcrm, dockerfile: Dockerfile }
          - { name: deskcomm-worker, dockerfile: Dockerfile.worker }
          - { name: deskcomm-scheduler, dockerfile: Dockerfile.scheduler }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      # Each build gets its own tag (version-en-<commit>), so a known-good image is never overwritten
      # and rolling back is changing three tags in the server's .env.
      - name: Tag
        id: tag
        env:
          VERSION: ${{ inputs.version || '1.113.0' }}
        run: echo "value=${VERSION}-en-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.tag.outputs.value }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: APP_VERSION=${{ inputs.version || '1.113.0' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
